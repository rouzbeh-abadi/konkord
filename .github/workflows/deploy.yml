name: Deploy site

# Publishes `site/` to Cloudflare Workers. Checked in for the same reason
# wrangler.jsonc is: a deployment nobody can read is a deployment nobody can
# reproduce. Needs two repository secrets, CLOUDFLARE_API_TOKEN (with the
# "Edit Cloudflare Workers" template) and CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "wrangler.jsonc"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

# Never let two deploys race; the later push should win, not whichever
# upload happens to finish last.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
</content>
