name: Publish

# Manual on purpose. Konkord is not on PyPI yet and will not be until a suite
# can carry its own judging rubric, so a release must not drag an upload along
# with it. Add
#
#   release:
#     types: [published]
#
# back to the triggers once trusted publishing is configured and every release
# should ship.
#
# Dispatch this against a tag rather than a branch. The version comes from
# pyproject.toml, not from the tag: the tag names the commit, the file is the
# source of truth, and a mismatch between them fails the job below rather than
# uploading something mislabelled.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Check the tag matches the packaged version
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          packaged="$(python3 -c \
            'import tomllib,pathlib;print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [ "$tagged" != "$packaged" ]; then
            echo "ref $GITHUB_REF_NAME does not name version $packaged." >&2
            echo "Run this workflow against the tag for the release, not a branch." >&2
            exit 1
          fi

      - name: Build
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted publishing: PyPI verifies this workflow's identity, so there is
      # no API token to store or rotate.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
</content>
