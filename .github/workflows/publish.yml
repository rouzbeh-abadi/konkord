name: Publish

# Runs when a GitHub release is published. The version comes from
# pyproject.toml, not from the tag: the tag names the commit, the file is the
# source of truth, and a mismatch between them fails the job below rather than
# uploading something mislabelled.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Check the tag matches the packaged version
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          packaged="$(python3 -c \
            'import tomllib,pathlib;print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [ "$tagged" != "$packaged" ]; then
            echo "tag $GITHUB_REF_NAME does not match pyproject version $packaged" >&2
            exit 1
          fi

      - name: Build
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted publishing: PyPI verifies this workflow's identity, so there is
      # no API token to store or rotate.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
</content>
