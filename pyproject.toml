[project]
name = "konkord"
version = "0.1.0"
description = "Rank LLMs on a task suite, and measure whether the automated judge can be trusted."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rouzbeh Abadi", email = "rouzbeh.abadi@me.com" }]
keywords = ["llm", "eval", "benchmark", "judge", "calibration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = ["typer>=0.16"]

[project.urls]
Homepage = "https://github.com/rouzbeh-abadi/konkord"
Issues = "https://github.com/rouzbeh-abadi/konkord/issues"

[project.scripts]
konkord = "konkord.cli:app"

[dependency-groups]
dev = ["mypy>=1.17", "pytest>=8.4", "ruff>=0.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/konkord"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A",    # flake8-builtins
    "ANN",  # flake8-annotations  -- the quality bar: type hints on every function
    "ARG",  # flake8-unused-arguments
    "B",    # flake8-bugbear
    "BLE",  # flake8-blind-except -- the quality bar: no bare except
    "C4",   # flake8-comprehensions
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "RUF",  # ruff-specific
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]

[tool.ruff.lint.per-file-ignores]
# B008: typer's idiom is function defaults holding Option()/Argument() objects.
# ARG001: command handlers receive their arguments from typer, and phase-1 stubs
#         do not consume them yet.
"src/konkord/cli.py" = ["ARG001", "B008"]
"tests/**" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
