[project]
name = "konkord"
version = "1.0.0"
description = "Rank LLMs on a task suite, and measure whether the automated judge can be trusted."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rouzbeh Abadi", email = "rouzbeh.abadi@me.com" }]
keywords = ["llm", "eval", "benchmark", "judge", "calibration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "diskcache>=5.6.3",
    "duckdb>=1.5.5",
    "litellm>=1.94.1",
    "numpy>=2.5.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "tenacity>=9.1.4",
    "typer>=0.16",
]

[project.urls]
Homepage = "https://github.com/rouzbeh-abadi/konkord"
Issues = "https://github.com/rouzbeh-abadi/konkord/issues"

[project.scripts]
konkord = "konkord.cli:app"

[project.optional-dependencies]
label = [
    "streamlit>=1.40",
]

[dependency-groups]
dev = [
    "mypy>=1.17",
    "pytest>=8.4",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.12",
    "types-pyyaml>=6.0.12.20260724",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/konkord"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A",    # flake8-builtins
    "ANN",  # flake8-annotations  -- the quality bar: type hints on every function
    "ARG",  # flake8-unused-arguments
    "B",    # flake8-bugbear
    "BLE",  # flake8-blind-except -- the quality bar: no bare except
    "C4",   # flake8-comprehensions
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "RUF",  # ruff-specific
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]

[tool.ruff.lint.per-file-ignores]
# B008: typer's idiom is function defaults holding Option()/Argument() objects.
"src/konkord/cli.py" = ["B008"]
# litellm returns untyped response objects; the helpers that unpack them are the
# one place `Any` is unavoidable, and they exist to contain it.
"src/konkord/litellm_provider.py" = ["ANN401"]
"tests/**" = ["ANN", "SLF001"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["diskcache.*"]
ignore_missing_imports = true

# litellm ships py.typed but does not re-export its exception classes.
[[tool.mypy.overrides]]
module = ["litellm", "litellm.*"]
implicit_reexport = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"
